<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="听冬 的数据面板">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1000" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="379" rx="18" fill="url(#card)" stroke="#1e2c47"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="44" y="54" font-size="14" letter-spacing="3" fill="#7d93b4">数据面板 · DATA</text>
    <text x="956" y="54" text-anchor="end" font-size="13" fill="#5c7093">AS OF 2026-09-27</text>

    <text x="44" y="132" font-size="48" font-weight="700" fill="#eaf2ff">285</text>
    <text x="44" y="162" font-size="15" fill="#8ba3c4">近一年贡献</text>

    <text x="380" y="132" font-size="48" font-weight="700" fill="#eaf2ff">66</text>
    <text x="380" y="162" font-size="15" fill="#8ba3c4">Star 收藏</text>

    <text x="716" y="132" font-size="48" font-weight="700" fill="#eaf2ff">6</text>
    <text x="716" y="162" font-size="15" fill="#8ba3c4">仓库（含私有）</text>

    <rect x="44" y="190" width="912" height="1" fill="#1a2740"/>

    <g font-size="15">
      <text x="44" y="228" fill="#c6d6ee">开发</text>
      <rect x="150" y="216" width="740" height="12" rx="6" fill="#141f36"/>
      <rect x="150" y="216" width="740" height="12" rx="6" fill="#6ba8ff"/>
      <text x="956" y="228" text-anchor="end" fill="#8ba3c4">25</text>

      <text x="44" y="253" fill="#c6d6ee">玩机</text>
      <rect x="150" y="241" width="740" height="12" rx="6" fill="#141f36"/>
      <rect x="150" y="241" width="444" height="12" rx="6" fill="#b58cff"/>
      <text x="956" y="253" text-anchor="end" fill="#8ba3c4">15</text>

      <text x="44" y="278" fill="#c6d6ee">逆向</text>
      <rect x="150" y="266" width="740" height="12" rx="6" fill="#141f36"/>
      <rect x="150" y="266" width="414" height="12" rx="6" fill="#ff9a6c"/>
      <text x="956" y="278" text-anchor="end" fill="#8ba3c4">14</text>

      <text x="44" y="303" fill="#c6d6ee">工具</text>
      <rect x="150" y="291" width="740" height="12" rx="6" fill="#141f36"/>
      <rect x="150" y="291" width="385" height="12" rx="6" fill="#5fd7a8"/>
      <text x="956" y="303" text-anchor="end" fill="#8ba3c4">13</text>

      <text x="44" y="328" fill="#c6d6ee">AI</text>
      <rect x="150" y="316" width="740" height="12" rx="6" fill="#141f36"/>
      <rect x="150" y="316" width="207" height="12" rx="6" fill="#ffd166"/>
      <text x="956" y="328" text-anchor="end" fill="#8ba3c4">7</text>

      <text x="44" y="353" fill="#c6d6ee">个人</text>
      <rect x="150" y="341" width="740" height="12" rx="6" fill="#141f36"/>
      <rect x="150" y="341" width="30" height="12" rx="6" fill="#8fd3ff"/>
      <text x="956" y="353" text-anchor="end" fill="#8ba3c4">1</text>
    </g>

    <text x="44" y="374" font-size="12" fill="#5c7093">GitHub Lists 分类：一个仓库可同时属于多个 List，共 75 条归属</text>
  </g>
